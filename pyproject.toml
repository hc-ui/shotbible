[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shotbible"
version = "0.2.0"
description = "Local continuity bible for AI image/video productions — lock characters, scenes, and compile consistent prompts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "hc-ui" }]
keywords = ["ai-video", "prompt", "continuity", "storyboard", "imagine"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
shotbible = "shotbible.cli:main"

[project.urls]
Homepage = "https://github.com/hc-ui/shotbible"
Issues = "https://github.com/hc-ui/shotbible/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/shotbible"]

[tool.hatch.build.targets.sdist]
include = [
  "src/shotbible",
  "tests",
  "examples",
  "README.md",
  "README.zh-CN.md",
  "LICENSE",
  "CHANGELOG.md",
  "SPEC.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
